# CI/CD «Пульса маржи»: тесты → образ в GHCR → выкатка на vm1 (https://pulse.modeus.cc).
# Как устроено, какие секреты нужны и как откатить: deploy/README.md.
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Линтер и тесты
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-venv
      - run: make lint
      - run: make test

  # Данные и отчёты радара лежат в git (эталон с SHA-256 в manifest.json), поэтому образ собирается
  # прямо из checkout: панель реестра собирается внутри Dockerfile, слои кэшируются BuildKit в Actions.
  build:
    name: Образ
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.ref.outputs.image }}
    steps:
      - uses: actions/checkout@v7

      - name: Имя образа
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      - name: Сборка и публикация образа
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ steps.name.outputs.image }}:sha-${{ github.sha }}
            ${{ github.ref == 'refs/heads/main' && format('{0}:latest', steps.name.outputs.image) || '' }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=pulse-image
          cache-to: type=gha,mode=max,scope=pulse-image

      - name: Ссылка на образ по digest
        id: ref
        env:
          IMAGE: ${{ steps.name.outputs.image }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: echo "image=$IMAGE@$DIGEST" >> "$GITHUB_OUTPUT"

  deploy:
    name: Выкатка на vm1
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    environment:
      name: production
      url: https://pulse.modeus.cc
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Ключ и отпечаток сервера
        env:
          SSH_KEY: ${{ secrets.VM1_SSH_KEY }}
          KNOWN_HOSTS: ${{ vars.VM1_KNOWN_HOSTS }}
        run: |
          [ -n "$SSH_KEY" ] || { echo "::error::Нет секрета VM1_SSH_KEY в окружении production"; exit 1; }
          [ -n "$KNOWN_HOSTS" ] || { echo "::error::Нет переменной VM1_KNOWN_HOSTS в окружении production"; exit 1; }
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      # Ключ на сервере ограничен принудительной командой deploy/pulse-deploy: она принимает только
      # ссылку на образ по digest, а логин и токен GHCR читает из stdin (токен живёт до конца задачи).
      - name: Выкатка образа
        env:
          IMAGE: ${{ needs.build.outputs.image }}
          HOST: ${{ vars.VM1_HOST || 'vm1.modeus.cc' }}
          SSH_USER: ${{ vars.VM1_USER || 'root' }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s\n%s\n' "$GITHUB_ACTOR" "$GHCR_TOKEN" |
            ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
                -o ConnectTimeout=20 -o ServerAliveInterval=15 "$SSH_USER@$HOST" "$IMAGE"

      - name: Проверка сайта
        run: curl -fsS --retry 10 --retry-delay 3 --retry-all-errors https://pulse.modeus.cc/api/health

      - name: Удалить ключ
        if: always()
        run: rm -f ~/.ssh/deploy_key
