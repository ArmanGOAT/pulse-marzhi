# Прод на vm1: образ из GHCR по digest, nginx на хосте проксирует https://pulse.modeus.cc на 127.0.0.1:8000.
# Лежит на сервере в /opt/pulse-marzhi/compose.prod.yaml, ставится вручную (deploy/README.md);
# образ подставляет deploy/pulse-deploy через PULSE_IMAGE.
name: pulse-marzhi

services:
  pulse:
    image: ${PULSE_IMAGE:?PULSE_IMAGE не задан}
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
    mem_limit: 2g
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 2s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
