# Сегменты для разбивки качества радара (как в Model Cards: качество по группам, слабые группы тоже показываем).
# Кардио: ручное сопоставление МНН с группами ATC ВОЗ B01 (антитромботические) и C (сердечно-сосудистые).
# status: estimate — список составлен командой, сверить со справочником ATC.
version: 1
bootstrap: {resamples: 300, seed: 42, min_n: 50, min_positives: 10}

cardio:
  status: estimate
  source: "Группы ATC ВОЗ B01 и C, ручное сопоставление по МНН"
  inn_keywords: [
    ривароксабан, апиксабан, дабигатран, эдоксабан, варфарин, клопидогрел, тикагрелор, прасугрел,
    гепарин, эноксапарин, надропарин, аторвастатин, розувастатин, симвастатин, питавастатин,
    фенофибрат, эзетимиб, амлодипин, нифедипин, лерканидипин, верапамил, дилтиазем,
    бисопролол, метопролол, карведилол, небиволол, атенолол, пропранолол,
    валсартан, лозартан, телмисартан, кандесартан, ирбесартан, азилсартан, олмесартан,
    лизиноприл, эналаприл, периндоприл, рамиприл, каптоприл, фозиноприл, зофеноприл,
    индапамид, гидрохлоротиазид, торасемид, фуросемид, спиронолактон, эплеренон,
    амиодарон, пропафенон, дигоксин, триметазидин, ивабрадин, сакубитрил, нитроглицерин,
    изосорбид, ранолазин, моксонидин, мельдоний
  ]
