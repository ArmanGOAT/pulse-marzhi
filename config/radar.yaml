# Настройки радара пересмотра: волны, метка, модели, пространство подбора, правило выбора чемпиона.
# Меняем здесь — код не трогаем. Каждый запуск сохраняет копию этого файла в папку эксперимента.
version: 1
seed: 42

label:
  cut_threshold: 0.10        # снижение на 10% и больше считаем «снизили»

# Волны пересмотра по реальным данным реестра (mpa.uz). asof — дата прогноза, label_end — конец окна исхода.
waves:
  - {name: "A: декабрь 2025 – январь 2026", asof: "2025-12-01", label_end: "2026-02-01"}
  - {name: "B: июль 2026",                  asof: "2026-06-01", label_end: "2026-08-01"}
  - {name: "C: ноябрь 2026",                asof: "2026-10-01", label_end: "2026-11-17"}

# Роли волн: на train учим при подборе, на validation выбираем гиперпараметры и чемпиона,
# test трогаем один раз в конце. Финальная модель учится на всех волнах.
split:
  tune_train: ["A: декабрь 2025 – январь 2026"]
  validation: "B: июль 2026"
  test_train: ["A: декабрь 2025 – январь 2026", "B: июль 2026"]
  test: "C: ноябрь 2026"

selection:
  metric: auc                # по нему выбираем гиперпараметры и чемпиона на validation
  candidates: [woe_logit, catboost]

# Набор признаков: base — цена и аналоги той же дозы; history — плюс история по МНН, производителю и цена за 1 мг.
feature_set: base

# На каких упаковках учимся и оцениваем: all — все рецептурные; imports — только импортные (наш пользователь).
scope:
  train: all
  eval: all

models:
  woe_logit:
    defaults: {n_bins: 6, smoothing: 0.5, min_share: 0.01, C: 0.5}
    search:
      n_bins: [4, 6, 8, 10]
      min_share: [0.005, 0.01]
      C: [0.05, 0.1, 0.5, 1.0, 5.0]
  catboost:
    defaults: {iterations: 400, depth: 6, learning_rate: 0.05, l2_leaf_reg: 3, calibration_folds: 3}
    search:
      depth: [4, 6]
      learning_rate: [0.03, 0.1]
      l2_leaf_reg: [3, 10]
